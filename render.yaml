services:
  - type: web
    name: greenhouse-customer-support-front
    runtime: static
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: SKIP_INSTALL_DEPS
        value: true
      - key: VITE_API_URL
        sync: false
